<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
     <div class="app-container">
        <h1>🚀 Mi Tablero Kanban</h1>
        <p>Fase 3: Gestión de Estados Avanzada</p>

        <!-- Barra de Captura Superior -->
        <div class="captura-seccion">
            <input type="text" id="inputTarea" placeholder="Escribe una tarea y presiona Enter o Guardar...">
            <button id="btnGuardar">Agregar Tarea</button>
        </div>

        <!-- El Tablero de 3 Columnas -->
        <div class="tablero-kanban">
            
            <!-- Columna 1: Pendientes -->
            <div class="columna">
                <h2>📝 Pendientes</h2>
                <div id="columnaTodo" class="tareas-contenedor"></div>
            </div>

            <!-- Columna 2: En Proceso -->
            <div class="columna">
                <h2>⏳ En Proceso</h2>
                <div id="columnaInProgress" class="tareas-contenedor"></div>
            </div>

            <!-- Columna 3: Terminadas -->
            <div class="columna">
                <h2>✅ Terminadas</h2>
                <div id="columnaDone" class="tareas-contenedor"></div>
            </div>

        </div>
    </div>
</body>
</html>
